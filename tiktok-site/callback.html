<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connecting TikTok — AutoClip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 id="title">Connecting your TikTok account…</h1>
  <p id="text" class="muted">Returning to the app on your computer.</p>
</main>
<script>
// TikTok redirects here (an https page) with ?code=…&state=…. The app puts its local port at the end
// of `state` as "~<port>", so this page forwards the answer to the app on this computer.
// It only ever redirects to 127.0.0.1, never to another host.
(function () {
  var q = new URLSearchParams(location.search);
  var match = /~(\d{4,5})$/.exec(q.get("state") || "");
  var port = match ? parseInt(match[1], 10) : 0;
  if (!port || port < 1024 || port > 65535) {
    document.getElementById("title").textContent = "Could not connect";
    document.getElementById("text").textContent =
      "This page was opened without a valid sign-in request. Start the connection again from the app.";
    return;
  }
  location.replace("http://127.0.0.1:" + port + "/api/tiktok/callback" + location.search);
})();
</script>
</body>
</html>
